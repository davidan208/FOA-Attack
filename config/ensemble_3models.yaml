# Configuration for ensemble_3models.py

defaults:
  - _self_

data:
  batch_size: 10
  num_samples: 1000
  output: "./sot_attack_output"
  cle_data_path: "resources/images/bigscale"
  tgt_data_path: "resources/images/target_images"

optim:
  alpha: 1.0
  epsilon: 16
  steps: 300 # 300
  use_mca: true
  num_crops: 5

model:
  input_res: 224
  use_source_crop: true
  use_target_crop: true
  crop_scale: [0.5, 0.9] 
  ensemble: true
  device: "cuda:0"# Using GPU 1
  backbone: ["B16", "B32", "Laion"]  # Use all models in ensemble

wandb:
  project: "local_adversarial_attack"
  entity: ??? # fill your wandb entity

blackbox:
  model_name: "gemini"  # Can be gpt4o, claude, gemini, gpt_4v
  batch_size: 1
  timeout: 30

attack: 'mifgsm' # [fgsm, mifgsm, pgd]

# Experiment seed. null = leave PyTorch unseeded (the original default run).
# Each (attack, seed) pair is written to its own folder: output/img/<attack>_seed<seed>_<hash>
seed: 2026
