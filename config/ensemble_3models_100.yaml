# Configuration for ensemble_3models - 100 samples subset (images 0-99)

defaults:
  - _self_

data:
  batch_size: 1
  num_samples: 100
  output: "./foa_attack_output_100"
  cle_data_path: "resources/images/bigscale_100"
  tgt_data_path: "resources/images/target_images_100"

optim:
  alpha: 1.0
  epsilon: 16
  steps: 100
  use_mca: true
  num_crops: 5

model:
  input_res: 224
  use_source_crop: true
  use_target_crop: true
  crop_scale: [0.5, 0.9]
  ensemble: true
  device: "cuda:0"
  backbone: ["B16", "B32", "Laion"]

wandb:
  project: "local_adversarial_attack"
  entity: ???

blackbox:
  model_name: "gemini"
  batch_size: 1
  timeout: 30

attack: 'fgsm'
